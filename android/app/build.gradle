plugins { id 'com.android.application' }

android {
    namespace 'com.knowledgechat.test'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.knowledgechat.test'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1-test'
    }

    // Android's default debug configuration generates a local debug keystore.
    // No private signing key or signing password is distributed with this project.
    buildTypes { debug { debuggable true } }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
